services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: logistics-ai-backend
    env_file:
      - .env
    environment:
      SQL_SERVER_HOST: host.docker.internal
      SQL_SERVER_PORT: "1433"
      FLOCI_ENDPOINT_URL: http://host.docker.internal:4566
      AWS_DEFAULT_REGION: us-east-1
      HF_HOME: /root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: logistics-ai-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  huggingface_cache:
